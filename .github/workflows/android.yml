name: Android CI

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2

      # TEMPORARY: generates the lint baseline and prints it (gzip, base64) so that it can be
      # committed. Removed in the commit that adds app/lint-baseline.xml.
      - name: Generate lint baseline
        run: |
          cd AndorsTrail
          ./gradlew -Dorg.gradle.jvmargs=-Xmx4g updateLintBaseline
          echo "LINT-BASELINE-BEGIN"
          gzip -9c app/lint-baseline.xml | base64 -w 120
          echo "LINT-BASELINE-END"

      - name: Build and test
        # Release unit tests run the code paths of release builds (DEVELOPMENT_* flags off).
        run: cd AndorsTrail && ./gradlew testDebugUnitTest testReleaseUnitTest assembleDebug assembleRelease

      - name: Lint
        # The default daemon heap is too small to lint the 1,296 map resources.
        run: cd AndorsTrail && ./gradlew -Dorg.gradle.jvmargs=-Xmx4g lintDebug

      - name: APK report
        run: |
          set -o pipefail
          bash audit/remediation/scripts/apk-report.sh AndorsTrail/app/build/outputs/apk/debug/*.apk --check | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload APK
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0, Node 24
        with:
          name: android-debug-apk
          path: AndorsTrail/app/build/outputs/apk/debug/*.apk

  worldmap-page:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Install Playwright and Chromium
        run: |
          npm install --no-save --prefix audit/remediation/worldmap playwright@1.56.1
          npx --prefix audit/remediation/worldmap playwright install --with-deps chromium

      - name: World map page regression tests
        run: |
          set -o pipefail
          python3 audit/remediation/worldmap/build_pages.py "$RUNNER_TEMP/worldmap-pages"
          node audit/remediation/worldmap/scenarios.js "$RUNNER_TEMP/worldmap-pages" | tee "$RUNNER_TEMP/worldmap-report.json"

  content:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Content and translation checks
        run: |
          set -o pipefail
          bash audit/remediation/scripts/check-content.sh | tee -a "$GITHUB_STEP_SUMMARY"
