name: Android CI

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build and test
        run: cd AndorsTrail && ./gradlew testDebugUnitTest assembleDebug

      - name: APK report
        run: |
          set -o pipefail
          bash audit/remediation/scripts/apk-report.sh AndorsTrail/app/build/outputs/apk/debug/*.apk --check | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: android-debug-apk
          path: AndorsTrail/app/build/outputs/apk/debug/*.apk

  worldmap-page:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install Playwright and Chromium
        run: |
          npm install --no-save --prefix audit/remediation/worldmap playwright@1.56.1
          npx --prefix audit/remediation/worldmap playwright install --with-deps chromium

      - name: World map page regression tests
        run: |
          set -o pipefail
          python3 audit/remediation/worldmap/build_pages.py "$RUNNER_TEMP/worldmap-pages"
          node audit/remediation/worldmap/scenarios.js "$RUNNER_TEMP/worldmap-pages" | tee "$RUNNER_TEMP/worldmap-report.json"
